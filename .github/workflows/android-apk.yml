name: NOVIA HOME Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components (without legacy tools package)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}/cmdline-tools" >&2
            find "${ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify SDK packages
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "Android SDK 35 and Build Tools 35.0.0 are installed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="novia_apk_phase1"
          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "Project directory '$PROJECT_DIR' not found. Check repository root/ZIP layout." >&2
            ls -la
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-debug-APK
          path: novia_apk_phase1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-build-reports
          path: |
            novia_apk_phase1/**/build/reports/**
            novia_apk_phase1/**/build/outputs/**/logs/**
          if-no-files-found: warn
          retention-days: 14
