name: NOVIA HOME Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify SDK packages
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Locate Android project root
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "build.gradle" && -d "app" ]]; then
            PROJECT_DIR="."
          elif [[ -f "novia_apk_phase1/build.gradle" && -d "novia_apk_phase1/app" ]]; then
            PROJECT_DIR="novia_apk_phase1"
          else
            echo "Android project root not found" >&2
            find . -maxdepth 4 -type f \( -name build.gradle -o -name settings.gradle -o -name AndroidManifest.xml \) -print >&2
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      # Phase 8.4: force known-good plugin repositories/version in CI.
      # This prevents stale/missing root Gradle plugin declarations from blocking AGP resolution.
      - name: Normalize Gradle root configuration for CI
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "Before patch: root build.gradle"
          sed -n '1,100p' build.gradle || true
          echo "Before patch: settings.gradle"
          sed -n '1,100p' settings.gradle || true
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NOVIA_HOME'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          echo "Normalized root Gradle files:"
          cat settings.gradle
          cat build.gradle

      - name: Print app Gradle configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "--- app/build.gradle ---"
          sed -n '1,200p' app/build.gradle

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            novia_apk_phase1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/**/logs/**
          if-no-files-found: warn
          retention-days: 14
