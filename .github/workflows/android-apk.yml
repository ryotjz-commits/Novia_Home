name: NOVIA HOME Android APK - Phase 8.6

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Identify workflow revision
        run: |
          echo "PHASE=8.6"
          echo "COMMIT=$GITHUB_SHA"
          git log -1 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate project root
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build.gradle && -d app ]]; then
            DIR="."
          elif [[ -f novia_apk_phase1/build.gradle && -d novia_apk_phase1/app ]]; then
            DIR="novia_apk_phase1"
          else
            echo "Cannot find Android project root" >&2
            find . -maxdepth 5 -type f \( -name build.gradle -o -name AndroidManifest.xml \) -print
            exit 1
          fi
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $DIR"

      - name: Normalize root and app module Gradle files (Phase 8.6)
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -d app/src/main
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NOVIA_HOME'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.novia.home'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.novia.home'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '1.0-phase7-rc1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          echo "=== Phase 8.6 app/build.gradle ==="
          cat app/build.gradle
          echo "=== Confirm manifest ==="
          test -f app/src/main/AndroidManifest.xml
          echo "Manifest OK"

      - name: Verify Android module task registration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:tasks --all | tee android-tasks.txt
          grep -E 'assembleDebug' android-tasks.txt

      - name: Build APK (module-qualified)
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            novia_apk_phase1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVIA-HOME-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**/logs/**
            android-tasks.txt
          if-no-files-found: warn
          retention-days: 14
          
